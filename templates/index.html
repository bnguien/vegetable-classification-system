<!DOCTYPE html>
<html>
<head>
    <title>Vegetable Classifier</title>
</head>
<body>
    <h1>Upload Image</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button type="submit">Predict</button>
    </form>

    {% if result %}
        <h2>{{ result }}</h2>
    {% endif %}
</body>
</html>
